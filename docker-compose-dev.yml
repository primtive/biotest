services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - DATABASE_URL=mongodb://admin:12345678@mongo:27017/biotest?authSource=admin&tls=false&directConnection=true
      - NEXTAUTH_URL=http://localhost
      - NEXTAUTH_SECRET=secret
    ports:
      - 80:3000
    networks:
      - proxy_network
  mongo:
    image: mongo:4.4.6
    command: >
      mongod --replSet rs0
             --bind_ip_all
             --auth
             --keyFile /data/configdb/keyfile
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=12345678
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./mongo-keyfile:/data/configdb/keyfile:ro
    networks:
      - proxy_network

volumes:
  npm_data:
  npm_letsencrypt:
  mongo_data:
  mongo_config:

networks:
  proxy_network:
    driver: bridge